name: dwb-skim
options:
  minimumXcodeGenVersion: "2.0"
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.dwb

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

packages:
  vlckit-spm:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  dwb-skim:
    type: application
    productName: "dwb skim"
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: dwb-skim
        excludes:
          - Resources/Info.plist
    resources:
      - path: dwb-skim/Resources/Info.plist
      - path: dwb-skim/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: dwb-skim/Resources/Info.plist
        MARKETING_VERSION: "4.2.2"
        CURRENT_PROJECT_VERSION: "4.2.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwb.skim
        PRODUCT_NAME: "dwb skim"
        PRODUCT_MODULE_NAME: dwb_skim
        SWIFT_MODULE_NAME: dwb_skim
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: vlckit-spm
        product: VLCKitSPM

  dwb-skimTests:
    type: bundle.unit-test
    productName: "dwb-skimTests"
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: dwb-skimTests
      - path: dwb-skim/Player/MediaFileSupportCore.swift
      - path: dwb-skim/Player/PlaybackCompletionPolicy.swift
      - path: dwb-skim/Player/MediaPlaybackPolicy.swift
      - path: dwb-skim/Player/VideoAudioNormalizationPolicy.swift
      - path: dwb-skim/Player/VolumeOverlayPresentation.swift
      - path: dwb-skim/Player/QueueOrderPlanner.swift
      - path: dwb-skim/Player/QueueRenameReconciler.swift
      - path: dwb-skim/Player/QueueDisplayProjection.swift
      - path: dwb-skim/Player/SkimFileRenamer.swift
      - path: dwb-skim/Player/SkimReviewStatusDescriptor.swift
      - path: dwb-skim/Player/SkimReviewState.swift
      - path: dwb-skim/App/DebugLogSanitizer.swift
      - path: dwb-skim/App/DebugLogRetentionBuffer.swift
      - path: dwb-skim/App/BookmarkStore.swift
      - path: dwb-skim/App/SettingsDefaultsRegistry.swift
      - path: dwb-skim/App/SkimSettingsStore.swift
      - path: dwb-skim/App/BackgroundAudioSettings.swift
      - path: dwb-skim/App/SettingsPresentation.swift
      - path: dwb-skim/Player/SkimColors.swift
      - path: dwb-skim/Player/SkimPreviewPlaybackPlan.swift
      - path: dwb-skim/Player/SkimPreviewSessionScheduler.swift
      - path: dwb-skim/Player/SkimPlaybackStartIntent.swift
      - path: dwb-skim/Player/SkimMediaAssignment.swift
      - path: dwb-skim/Player/SkimTogglePolicy.swift
      - path: dwb-skim/Player/SkimKeyboardShortcut.swift
      - path: dwb-skim/Player/SkimFolderDropShuffle.swift
      - path: dwb-skim/Player/ProgressiveRandomSkimPlan.swift
      - path: dwb-skim/Player/SkimFailedItemTracker.swift
      - path: dwb-skim/Player/OptionDoubleTapRecognizer.swift
      - path: dwb-skim/Player/PlayerWindowReactivationPlanner.swift
      - path: dwb-skim/App/SkimApplicationConfiguration.swift
      - path: dwb-skim/Player/PreviewRangePlanner.swift
      - path: dwb-skim/Player/BackgroundAudioPlaybackController.swift
      - path: dwb-skim/Player/PlaybackBarPresentation.swift
      - path: dwb-skim/Player/QueueRemovalPlanner.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwb.skimTests
        PRODUCT_MODULE_NAME: dwb_skimTests
        SWIFT_MODULE_NAME: dwb_skimTests
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  dwb-skim:
    build:
      targets:
        dwb-skim: all

  dwb-skimTests:
    build:
      targets:
        dwb-skimTests: all
    test:
      targets:
        - dwb-skimTests
